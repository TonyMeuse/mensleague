<style>
  :root{
    --green:#1f6b3a; --green-dark:#154d29; --green-light:#e4f2e8;
    --gold:#c99a2e; --red:#b3261e; --red-light:#fbe9e7;
    --ink:#1b1f1c; --muted:#5b665e; --line:#cfd8d1; --bg:#f4f6f3; --card:#ffffff;
  }
  *{box-sizing:border-box}
  html{font-size:20px}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;line-height:1.35}
  header{background:var(--green);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  header h1{margin:0;font-size:1.5rem;letter-spacing:.5px}
  nav{display:flex;gap:8px;flex-wrap:wrap;background:var(--green-dark);padding:10px 16px;position:sticky;top:0;z-index:10}
  nav button{background:transparent;color:#fff;border:2px solid transparent;font-size:1.05rem;font-weight:600;padding:12px 20px;border-radius:12px;cursor:pointer;min-height:56px}
  nav button.on{background:#fff;color:var(--green-dark)}

  main{padding:20px 24px 80px;max-width:1300px;margin:0 auto}
  h2{font-size:1.4rem;margin:24px 0 12px}
  h3{font-size:1.15rem;margin:0 0 10px}

  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}

  input,select{font-size:1.2rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px;min-height:56px;background:#fff;color:var(--ink);font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-light)}

  .btn{font-size:1.1rem;font-weight:700;padding:14px 24px;border-radius:12px;border:2px solid var(--green);background:var(--green);color:#fff;cursor:pointer;min-height:56px;font-family:inherit}
  .btn:hover{background:var(--green-dark)}
  .btn.ghost{background:#fff;color:var(--green)}
  .btn.ghost:hover{background:var(--green-light)}

  .btn.small{font-size:.95rem;padding:8px 14px;min-height:44px}
  .btn.big{font-size:1.3rem;padding:18px 32px;min-height:68px}
  .seg{display:flex;gap:0;flex-wrap:wrap}
  .seg button{font-size:1.1rem;font-weight:700;padding:14px 26px;min-height:56px;border:2px solid var(--green);background:#fff;color:var(--green);cursor:pointer;font-family:inherit}
  .seg button:first-child{border-radius:12px 0 0 12px}
  .seg button:last-child{border-radius:0 12px 12px 0}

  .seg button.on{background:var(--green);color:#fff}
  .muted{color:var(--muted)}
  .namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
  .namebtn{font-size:1.1rem;font-weight:600;padding:14px;min-height:64px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-align:left;font-family:inherit}

  .stat{display:inline-block;margin-right:28px}

  .plist button{display:flex;justify-content:space-between;width:100%;font-size:1.05rem;padding:12px 14px;min-height:54px;margin-bottom:6px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-family:inherit;color:var(--ink)}
  .plist button.on{border-color:var(--green);background:var(--green-light);font-weight:700}

  .plist h4{margin:14px 0 6px;color:var(--muted)}
  .card-grid{display:grid;grid-template-columns:90px repeat(9,1fr) 80px;gap:6px;align-items:center;margin-bottom:14px}
  .card-grid .h{text-align:center;font-weight:700;color:var(--muted);font-size:.9rem}
  .card-grid .par{text-align:center;font-size:.95rem;color:var(--muted)}
  .card-grid .lbl{font-weight:700}
  .card-grid input{width:100%;text-align:center;font-size:1.6rem;font-weight:700;padding:8px 0;min-height:64px}
  .card-grid input.p3{border-color:var(--gold)}
  .card-grid .tot{text-align:center;font-size:1.5rem;font-weight:800}
  .bigtotals{display:flex;gap:40px;margin-top:10px;font-size:1.2rem}
  .bigtotals b{font-size:2rem;display:block}
  .warn{background:#fff6e0;border:2px solid var(--gold);border-radius:12px;padding:12px 16px;margin-bottom:14px}
  .money{font-weight:700;color:var(--green-dark)}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:1.2rem}
  .pars{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
  .pars input{width:100%;text-align:center;padding:8px 0}
  .pars div{text-align:center;font-size:.85rem;color:var(--muted);font-weight:700}
  .print-only{display:none}

  .status.bad{background:#fff;color:var(--red)}
  #qrsheet{display:none;text-align:center;padding-top:40px}
  #qrsheet h1{font-size:2.6rem;margin:0 0 10px}
  #qrsheet .addr{font-size:2rem;font-weight:800;margin:24px 0 10px;word-break:break-all}
  #qrsheet #qrbox{display:inline-block;padding:16px;background:#fff}
  #qrsheet p{font-size:1.3rem}
  #qrsheet .addr{font-size:1.5rem;margin:10px 0 0}
  #qrsteps{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left;max-width:760px;margin:0 auto}

  #qrsteps .st p{font-size:1rem;margin:8px 0 0}
  @media print{ #qrsheet{padding-top:0} #qrsheet h1{font-size:2rem} }
  body.qr-printing header,body.qr-printing nav,body.qr-printing main{display:none!important}
  body.qr-printing #qrsheet{display:block}
  @media (max-width:800px){.scoreLayout{grid-template-columns:1fr}}

    html{font-size:13px}
    nav,header,.noprint,.btn{display:none!important}
    .print-only{display:block}
    body{background:#fff}
    main{padding:0}
    .card{border:1px solid #999;break-inside:avoid;padding:10px;margin-bottom:8px}
  }
</style>

<body>
<header><h1>⛳ League Manager</h1><span id="hdrInfo"></span><span id="saveStatus" class="status"></span></header>
<nav id="nav" style="display:none"></nav>
<main id="app"><div class="card empty">Loading…</div></main>
<div id="qrsheet"><h1>⛳ League</h1><p>Point your phone's camera at the code and tap the link that appears.</p>
  <div id="qrbox"></div><div class="addr" id="qraddr"></div>
  <h2 style="margin:18px 0 8px">Put the app on your iPhone</h2><div id="qrsteps"></div>
  <p style="font-size:1.05rem;margin-top:14px"><b>Android:</b> tap the three dots <b>⋮</b> at the top right → <b>Install app</b> → <b>Install</b>.</p></div>

<script>
/* ======================= DATA ======================= */
const KEY = 'mensLeague.v1';
const TABS = [
  ['checkin','1. Check-In'],['flights','2. Flights'],['scores','3. Scores'],['results','4. Results'],
  ['roster','Roster'],['history','History'],['settings','Settings']
];
let db, state = {tab:'checkin', search:'', scoreId:null, editCourse:null, viewWeek:null};

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function newWeek(courseId){return {date:todayStr(),courseId:courseId||null,players:{},flights:null,flightsKey:'',scores:{}}}
function defaultDB(){return {
  golfers:[], courses:[], history:[],
  settings:{entryFee:20, roundFee:10, skinsFee:5, par3Fee:1, hcpMethod:'course', tieRule:'cardoff', mode:'both', places:3, pct:{1:[100],2:[60,40],3:[50,30,20]}},
  week:newWeek(null)
}}
/* Everything is stored online in Supabase (one record holds the whole league). */
let sb=null, saveTimer=null, saving=false, again=false, dirty=false;
function normalize(){
  const d=defaultDB();
  for(const k in d) if(db[k]===undefined) db[k]=d[k];
  for(const k in d.settings) if(db.settings[k]===undefined) db.settings[k]=d.settings[k];
}
function setStatus(t,cls){ const e=document.getElementById('saveStatus'); e.textContent=t; e.className='status '+(cls||''); }
async function loadRemote(){
  const {data,error}=await sb.from('league_state').select('data').eq('league_id',league.id).maybeSingle();
  if(error) throw error;
  db=data?data.data:defaultDB(); normalize(); return !data;
}
function save(){
  try{ localStorage.setItem(KEY+'.copy', JSON.stringify(db)); }catch(e){}
  dirty=true; setStatus('Saving…'); clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  clearTimeout(saveTimer);
  if(saving){ again=true; return; }
  saving=true; dirty=false;
  const {error}=await sb.from('league_state').upsert({league_id:league.id,data:db,updated_at:new Date().toISOString()});
  saving=false;
  if(error){ dirty=true; console.error(error); setStatus('⚠ NOT SAVED – check internet','bad'); saveTimer=setTimeout(flush,5000); return false; }
  if(again){ again=false; return flush(); }
  await syncRoster();
  if(!dirty) setStatus('✓ Saved','ok');
  return true;
}
// Keep the golfers' name list on phones up to date whenever the roster changes
let rosterSent='';
async function syncRoster(){
  const list=db.golfers.map(g=>({id:g.id,name:g.name})), sig=league.id+JSON.stringify(list);
  if(sig===rosterSent) return;
  const {error}=await sb.from('public_roster').upsert({league_id:league.id,data:list});
  if(!error) rosterSent=sig;
}
window.isBusySaving=()=>dirty||saving;
window.addEventListener('beforeunload',e=>{ if(dirty||saving){ e.preventDefault(); e.returnValue=''; } });

/* One click in a box selects everything in it, so typing replaces it */
document.addEventListener('focusin',e=>{ const t=e.target;
  if(t.tagName==='INPUT' && /^(text|number|email|search|tel|date|)$/.test(t.type) && t.type!=='date'){ try{ t.select(); }catch(_){} t._sel=true; } });
document.addEventListener('mouseup',e=>{ if(e.target._sel){ e.preventDefault(); e.target._sel=false; } },true);
document.addEventListener('focusout',e=>{ e.target._sel=false; });

/* ======================= HELPERS ======================= */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>'$'+(Math.round((x||0)*100)/100).toFixed(2);
const ordinal=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
const golfer=id=>db.golfers.find(g=>g.id===id);
const getCourse=id=>db.courses.find(c=>c.id===id);
const coursePar=c=>c.pars.reduce((a,b)=>a+(+b||0),0);
function parseIndex(v){ v=String(v).trim(); if(v==='') return null; const plus=v.startsWith('+'); const n=parseFloat(v.replace('+','')); if(isNaN(n)) return null; return plus?-n:n; }
function showIndex(n){ if(n==null) return '—'; return n<0?'+'+(-n).toFixed(1):(+n).toFixed(1); }
// Strokes a golfer gets. League setting: subtract the Golf Canada handicap as-is (rounded),
// or convert it to a course handicap with slope and rating (World Handicap System formula).
function courseHcp(index,c){
  if(index==null) return 0;
  if(db.settings.hcpMethod!=='course' || !c) return Math.round(index);
  return Math.round(index*c.slope/113 + (c.rating - coursePar(c)));
}
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }

function weekPlayers(){
  const w=db.week, c=getCourse(w.courseId);
  return Object.keys(w.players).map(id=>{const g=golfer(id); if(!g) return null;
    const wp=w.players[id], calc=courseHcp(g.index,c), over=wp.ch!=null&&wp.ch!=='';
    return {id,name:g.name,index:g.index,ch:over?+wp.ch:calc,chCalc:calc,chOverride:over,skins:!!wp.skins};}).filter(Boolean);
}
const MAX_FLIGHTS=4;   // the league never uses more than 4 flights
function flightCount(n){ return n<10?1:Math.min(MAX_FLIGHTS,Math.floor(n/10)); }
function makeFlights(players){
  // Lowest handicap first; equal strokes are ordered by the more precise index.
  // Golfers with no handicap yet (and no strokes typed in) go to the last flight, like Golf Genius.
  const noHcp=x=>x.index==null && !x.chOverride;
  const p=[...players].sort((a,b)=>noHcp(a)-noHcp(b) || a.ch-b.ch || (a.index??0)-(b.index??0) || a.name.localeCompare(b.name));
  const n=p.length; if(!n) return [];
  const F=flightCount(n), base=Math.floor(n/F), rem=n%F, out=[]; let k=0;
  for(let i=0;i<F;i++){ const size=base+(i<rem?1:0); out.push(p.slice(k,k+size).map(x=>x.id)); k+=size; }
  return out;
}
function ensureFlights(force){
  const ps=weekPlayers(); const key='v4|'+MAX_FLIGHTS+'|'+db.week.courseId+'|'+ps.map(p=>p.id).sort().join(',');
  if(force || !db.week.flights || db.week.flightsKey!==key){ db.week.flights=makeFlights(ps); db.week.flightsKey=key; save(); }
  return db.week.flights;
}

/* ======================= CALCULATIONS ======================= */
// Awards places across one or more categories (Gross / Net). A golfer can win only once:
// the highest-paying open place is always filled first. Golfers still tied after the card-off
// (or all tied golfers, when the league splits ties) share the places they cover equally.
function awardPlaces(cats,places,pct){
  const out=[], taken=new Set();
  cats.forEach(c=>{c.next=0;c.amounts=pct.slice(0,places).map(p=>c.purse*(+p||0)/100);});
  for(;;){
    let best=null;
    for(const c of cats){
      if(c.next>=places) continue;
      const rem=c.list.filter(x=>!taken.has(x.id)); if(!rem.length) continue;
      const v=c.amounts[c.next];
      if(!best || v>best.v+1e-9) best={c,v,rem};
    }
    if(!best) break;
    const {c,rem}=best, top=rem[0], same=(a,b)=>a.score===b.score&&(a.tb||[]).join()===(b.tb||[]).join(), grp=rem.filter(x=>same(x,top));
    const end=Math.min(c.next+grp.length,places); let sum=0;
    for(let i=c.next;i<end;i++) sum+=c.amounts[i];
    const label=(grp.length>1?'T-':'')+ordinal(c.next+1);
    grp.forEach(x=>{taken.add(x.id); out.push({id:x.id,cat:c.key,place:label,placeNum:c.next+1,score:x.score,amount:sum/grp.length});});
    c.next+=grp.length;
  }
  return out;
}
function sortedHistory(){ return [...db.history].sort((a,b)=>a.date.localeCompare(b.date)||a.savedAt-b.savedAt); }
// Par 3 money rolls over week to week, per hole, until someone wins that hole outright.
function carryFor(course,holeIdx,beforeDate){
  let carry=+((course.startCarry||{})[holeIdx]||0);
  for(const wk of sortedHistory()){
    if(wk.courseId!==course.id || wk.date>=beforeDate) continue;
    const p=(wk.results.par3||[]).find(x=>x.holeIdx===holeIdx); if(!p) continue;
    const pot=p.base+carry; carry=p.winner?0:pot;
  }
  return carry;
}
function computeResults(){
  const w=db.week, c=getCourse(w.courseId), s=db.settings;
  if(!c) return null;
  ensureFlights();
  const P=Object.fromEntries(weekPlayers().map(p=>[p.id,p]));
  const pars=c.pars, par3Holes=pars.map((p,i)=>p===3?i:-1).filter(i=>i>=0), otherHoles=18-par3Holes.length;
  const res={date:w.date,courseId:c.id,courseName:c.name,mode:s.mode,places:s.places,roundFee:s.roundFee,skinsFee:s.skinsFee,
             flights:[],par3:[],payouts:{},warnings:[],playerCount:Object.keys(P).length,skinsCount:0};
  const pay=(id,k,amt)=>{ if(!res.payouts[id]) res.payouts[id]={name:P[id].name,round:0,skins:0,par3:0}; res.payouts[id][k]+=amt; };
  const sc=id=>w.scores[id]||[];
  const hole=(id,h)=>{const v=+sc(id)[h]; return v>0?v:0;};
  const isComplete=id=>{for(let h=0;h<18;h++) if(!hole(id,h)) return false; return true;};
  const gross=id=>{let t=0; for(let h=0;h<18;h++) t+=hole(id,h); return t;};
  const pct=s.pct[s.places]||[];

  (w.flights||[]).forEach((ids,fi)=>{
    ids=ids.filter(id=>P[id]); if(!ids.length) return;
    const name='Flight '+String.fromCharCode(65+fi);
    const rows=ids.map(id=>({id,name:P[id].name,ch:P[id].ch,skins:P[id].skins,complete:isComplete(id),gross:gross(id),net:gross(id)-P[id].ch}));
    rows.filter(r=>!r.complete).forEach(r=>res.warnings.push(`${r.name} (${name}) does not have all 18 scores entered — not counted for prizes.`));
    const done=rows.filter(r=>r.complete);
    const purse=s.roundFee*ids.length, share=s.mode==='both'?0.5:1, cats=[];
    // Card-off: compare the last 9, 6, 3 and 1 holes (net uses the matching share of the handicap)
    const cardoff=s.tieRule!=='split';
    const tb=(r,net)=>{ if(!cardoff) return []; const last=n=>{let t=0;for(let h=18-n;h<18;h++)t+=hole(r.id,h);return t;};
      return [[9,1/2],[6,1/3],[3,1/6],[1,1/18]].map(([n,f])=>Math.round((last(n)-(net?r.ch*f:0))*1000)/1000); };
    const order=(a,b)=>a.score-b.score||a.tb.reduce((d,v,i)=>d||v-b.tb[i],0);
    if(s.mode!=='net') cats.push({key:'Gross',purse:purse*share,list:done.map(r=>({id:r.id,score:r.gross,tb:tb(r,false)})).sort(order)});
    if(s.mode!=='gross') cats.push({key:'Net',purse:purse*share,list:done.map(r=>({id:r.id,score:r.net,tb:tb(r,true)})).sort(order)});
    const awards=awardPlaces(cats,s.places,pct);
    awards.forEach(a=>{a.name=P[a.id].name; pay(a.id,'round',a.amount);});
    const unpaid=cats.reduce((t,c)=>t+c.amounts.slice(c.next).reduce((a,b)=>a+b,0),0);
    if(done.length && unpaid>0.004) res.warnings.push(`${name}: ${money(unpaid)} of round money was not paid out (not enough golfers for every place).`);

    const sp=rows.filter(r=>r.skins);
    const skinsPot=s.skinsFee*sp.length, holes=[];
    for(let h=0;h<18;h++){ if(pars[h]===3) continue;
      const hs=sp.map(r=>({id:r.id,v:hole(r.id,h)})).filter(x=>x.v>0);
      if(!hs.length){holes.push({hole:h+1,low:null,winner:null,tied:0});continue;}
      const low=Math.min(...hs.map(x=>x.v)), at=hs.filter(x=>x.v===low);
      holes.push({hole:h+1,low,winner:at.length===1?at[0].id:null,winnerName:at.length===1?P[at[0].id].name:null,tied:at.length});
    }
    const won=holes.filter(x=>x.winner), skinValue=won.length?skinsPot/won.length:0;
    won.forEach(x=>pay(x.winner,'skins',skinValue));
    if(!won.length && skinsPot>0) res.warnings.push(`${name}: no skins were won, so ${money(skinsPot)} of skins money was not paid out.`);
    res.flights.push({name,rows,purse,awards,skinsPot,skinsPlayers:sp.length,holes,skinsWon:won.length,skinValue});
  });

  const allSkins=Object.values(P).filter(p=>p.skins); res.skinsCount=allSkins.length;
  const base=(+s.par3Fee||0)*allSkins.length;
  par3Holes.forEach(h=>{
    const carryIn=carryFor(c,h,w.date), pot=base+carryIn;
    const hs=allSkins.map(p=>({id:p.id,v:hole(p.id,h)})).filter(x=>x.v>0);
    let low=null,winner=null,tied=0;
    if(hs.length){ low=Math.min(...hs.map(x=>x.v)); const at=hs.filter(x=>x.v===low); tied=at.length; if(at.length===1) winner=at[0].id; }
    if(winner) pay(winner,'par3',pot);
    res.par3.push({holeIdx:h,hole:h+1,base,carryIn,pot,low,tied,winner,winnerName:winner?P[winner].name:null});
  });

  let paid=0; for(const id in res.payouts){const p=res.payouts[id]; p.total=p.round+p.skins+p.par3; paid+=p.total;}
  res.collectedRound=s.roundFee*res.playerCount;
  res.collectedSkins=s.skinsFee*res.skinsCount;
  res.collectedPar3=(+s.par3Fee||0)*res.skinsCount*par3Holes.length;
  res.entryTotal=(+s.entryFee||0)*res.playerCount;
  res.paid=paid;
  res.rollover=res.par3.filter(p=>!p.winner).reduce((a,p)=>a+p.pot,0);
  res.carryInTotal=res.par3.reduce((a,p)=>a+p.carryIn,0);
  return res;
}

function sumRange(s,start){let t=0;for(let i=start;i<start+9;i++)t+=(+s[i]||0);return t;}
function scoreInput(el,h){
  const v=el.value.replace(/\D/g,'').slice(0,2); el.value=v;
  const id=state.scoreId, w=db.week; if(!w.scores[id]) w.scores[id]=Array(18).fill(null);
  w.scores[id][h]=v?+v:null; save();
  const s=w.scores[id], tot=s.reduce((a,b)=>a+(+b||0),0), filled=s.filter(x=>x>0).length;
  const ch=weekPlayers().find(p=>p.id===id).ch;
  document.getElementById('t0').textContent=sumRange(s,0)||''; document.getElementById('t9').textContent=sumRange(s,9)||'';
  document.getElementById('tg').textContent=tot||'—'; document.getElementById('tn').textContent=filled===18?tot-ch:'—';

  if(btn){ btn.className=filled===18?'ok':'muted'; btn.textContent=filled===18?tot+' ✓':filled+'/18'; }

      <h3 style="margin-top:20px">Skins — ${f.skinsPlayers} in, pot ${money(f.skinsPot)}, ${f.skinsWon} won${f.skinsWon?` at ${money(f.skinValue)} each`:''}</h3>

// Saves the week to History, posts it for golfers, and alerts the golfers who played.
async function publishWeek(){
  const res=computeResults(); if(!res) return;
  if(!db.settings.leaguePassword) return alert('Please set a League Password in Settings first, so golfers can open the app.');
  if(res.warnings.some(w=>w.includes('18 scores')) && !confirm('Some golfers do not have all 18 scores. Publish anyway?')) return;
  const later=db.history.filter(x=>x.courseId===res.courseId && x.date>res.date);
  if(later.length && !confirm('There are already saved weeks AFTER this date. Par 3 carryovers on those weeks will not match. Publish anyway?')) return;
  const same=db.history.find(x=>x.date===res.date);
  if(same && !confirm(`The week of ${fmtDate(res.date)} was already published. Replace it with these results?`)) return;
  const sendAlert = same ? confirm('Send the alert to golfers again?') : true;
  if(!same && !confirm(`Publish results for ${fmtDate(res.date)}?\n\nGolfers who played will get an alert on their phone.`)) return;

  const c=getCourse(res.courseId), week=JSON.parse(JSON.stringify(db.week)), players={}, scores={};
  weekPlayers().forEach(p=>{ players[p.id]={name:p.name,ch:p.ch,skins:p.skins}; scores[p.id]=week.scores[p.id]||[]; });
  res.flights.forEach(f=>f.rows.forEach(r=>{ if(players[r.id]) players[r.id].flight=f.name; }));
  const pub={date:res.date,courseName:c.name,pars:c.pars,results:res,players,scores};

  busy('Publishing…');
  const r1=await sb.from('published_weeks').upsert({league_id:league.id,week_date:res.date,data:pub,published_at:new Date().toISOString()});
  const r2=await sb.from('public_roster').upsert({league_id:league.id,data:db.golfers.map(g=>({id:g.id,name:g.name}))});
  if(r1.error||r2.error){ console.error(r1.error||r2.error); alert('Could not publish. Please check the internet connection and try again.'); return render(); }

  if(same) db.history=db.history.filter(x=>x!==same);
  db.history.push({id:uid('w'),date:res.date,courseId:res.courseId,savedAt:Date.now(),results:res,week,published:true});
  save(); await flush();

  let msg='Results are published for golfers.';
  if(sendAlert){
    busy('Sending alerts…');
    const {data,error}=await sb.functions.invoke('send-push',{body:{leagueId:league.id,golferIds:Object.keys(players),title:`⛳ ${league.name} results are posted`,body:`Results for ${fmtDate(res.date)} are up. Tap to see how you did.`,url:golferUrl()}});
    if(error) { console.error(error); msg+='\n\nThe phone alerts could not be sent this time.'; }
    else msg+=`\n\nAlert sent to ${data.sent} phone${data.sent===1?'':'s'}.`+(Object.keys(players).length>data.sent?` (Golfers who haven't turned on alerts won't get one.)`:'');
  }
  // The next league night is set up automatically: one week after the latest published week
  const next=nextLeagueDate();
  db.week=newWeek(db.week.courseId); db.week.date=next; state.scoreId=null; save();
  go('history');
  alert(msg+`\n\nThe next league night (${fmtDate(next)}) is ready on Check-In.`);
}
function nextLeagueDate(){
  const last=sortedHistory().map(h=>h.date).pop()||db.week.date;
  const [y,m,d]=last.split('-').map(Number), t=new Date(y,m-1,d+7);
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}
function printQR(){
  const box=document.getElementById('qrbox'); box.innerHTML='';
  new QRCode(box,{text:golferUrl(),width:260,height:260,correctLevel:QRCode.CorrectLevel.M});

function filterRoster(q){ q=q.toLowerCase(); document.querySelectorAll('#rosterTable tr[data-name]').forEach(tr=>tr.style.display=tr.dataset.name.includes(q)?'':'none'); }
function addGolfer(){
  const n=document.getElementById('newName').value.trim(), iv=document.getElementById('newIdx').value;
  if(!n) return alert('Please type a name.');
  const idx=parseIndex(iv); if(idx==null) return alert('Please type a handicap index, like 12.4');
  if(db.golfers.some(g=>g.name.toLowerCase()===n.toLowerCase()) && !confirm(n+' is already on the roster. Add anyway?')) return;
  db.golfers.push({id:uid('g'),name:n,index:idx,active:true}); save(); render(); document.getElementById('newName').focus();
}
// Paste a list: "Name, index" per line. Names already on the roster get their index updated (no duplicates).
// A line with no index (e.g. "Jayden Deveau,") adds the golfer with a blank handicap.
function bulkAdd(){
  const lines=document.getElementById('bulk').value.split('\n').map(l=>l.trim()).filter(Boolean);
  let added=0, updated=0, bad=[];
  for(const l of lines){
    const cut=Math.max(l.lastIndexOf(','),l.lastIndexOf('\t'));
    let name=l, idx=null;
    if(cut>=0){ name=l.slice(0,cut).trim(); const t=l.slice(cut+1).trim();
      if(t!==''){ idx=parseIndex(t); if(idx==null){ bad.push(l); continue; } } }
    else { const m=l.match(/^(.*\S)\s+([+]?-?\d+(\.\d+)?)$/); if(m){ name=m[1]; idx=parseIndex(m[2]); } }
    name=name.replace(/\s+/g,' ').trim(); if(!name){ bad.push(l); continue; }
    const g=db.golfers.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(g){ if(idx!=null) g.index=idx; updated++; }
    else { db.golfers.push({id:uid('g'),name,index:idx,active:true}); added++; }
  }
  save(); render();
  alert(`Added ${added} golfer(s).`+(updated?` Updated ${updated} already on the roster.`:'')+(bad.length?`\n\nCould not read these lines:\n${bad.join('\n')}`:''));
}
function editGolfer(id,k,v){ const g=golfer(id); if(k==='name'){ if(!v.trim()) return render(); g.name=v.trim(); } else { const n=parseIndex(v); if(n==null && String(v).trim()!==''){alert('Please type a number like 12.4');return render();} g.index=n; } save(); render(); }
function delGolfer(id){ const g=golfer(id); if(!confirm(`Delete ${g.name} from the roster?`)) return; db.golfers=db.golfers.filter(x=>x.id!==id); delete db.week.players[id]; save(); render(); }

function rHistory(){

  if(!hist.length) return `<div class="card empty">No weeks published yet. After entering scores, go to <b>Results</b> and press <b>Publish to Golfers</b>.</div>`;
  const season={};
  hist.forEach(wk=>{ for(const id in wk.results.payouts){ const p=wk.results.payouts[id]; const g=golfer(id);
    if(!season[id]) season[id]={name:g?g.name:p.name,round:0,skins:0,par3:0,total:0,weeks:0};
    const s=season[id]; s.round+=p.round; s.skins+=p.skins; s.par3+=p.par3; s.total+=p.total; } });
  hist.forEach(wk=>Object.keys(wk.week.players||{}).forEach(id=>{ if(season[id]) season[id].weeks++; }));
  const money_list=Object.values(season).filter(s=>s.total>0.004).sort((a,b)=>b.total-a.total);
  return `<h2 style="margin-top:0">Saved weeks</h2><div class="card"><table><tr><th>Date</th><th>Course</th><th class="num">Players</th><th class="num">Paid out</th><th></th></tr>

    ${money_list.map((s,i)=>`<tr><td>${i+1}</td><td><b>${esc(s.name)}</b></td><td class="num">${s.weeks}</td><td class="num">${money(s.round)}</td><td class="num">${money(s.skins)}</td><td class="num">${money(s.par3)}</td><td class="num money">${money(s.total)}</td></tr>`).join('')}</table></div>`;

function reopenWeek(id){

async function delWeek(id){

function setHcpMethod(k){ db.settings.hcpMethod=k; if(db.week.flights) db.week.flightsKey=''; save(); render(); }
function setNum(k,v){ const n=parseFloat(v); if(isNaN(n)||n<0) return alert('Please enter a number.'); db.settings[k]=n; save(); render(); }
function setPct(i,v){ db.settings.pct[db.settings.places][i]=parseFloat(v)||0; save(); render(); }
function editCourse(id){
  const c=id?getCourse(id):null;
  state.editCourse=c?JSON.parse(JSON.stringify(c)):{id:null,name:'',slope:null,rating:null,pars:Array(18).fill(null),startCarry:{}};

function courseForm(c){
  const v=x=>x==null||x===''?'':x;
  const parRow=start=>{let h='';for(let i=start;i<start+9;i++)h+=`<div>${i+1}</div>`;
    for(let i=start;i<start+9;i++)h+=`<input id="par${i}" inputmode="numeric" maxlength="1" value="${v(c.pars[i])}" oninput="parInput(this,${i})">`;return h;};
  return `<div class="card"><h3>${c.id?'Edit course':'Add a course'}</h3><div class="row">

    <br><label>Par for each hole (total <span id="parTotal">${coursePar(c)||'—'}</span>)</label><div class="pars">${parRow(0)}</div><br><div class="pars">${parRow(9)}</div>
    <div id="p3carry">${carryHTML(c)}</div>

function carryHTML(c){
  const p3=c.pars.map((p,i)=>p===3?i:-1).filter(i=>i>=0); if(!p3.length) return '';
  return `<br><label>Par 3 money already carried over (only if your league has a rollover from before using this program)</label><div class="row">
    ${p3.map(i=>`<div><label>Hole ${i+1} $</label><input type="number" min="0" style="width:130px" value="${(c.startCarry||{})[i]||''}" placeholder="0" oninput="state.editCourse.startCarry[${i}]=+this.value||0"></div>`).join('')}</div>`;
}
// Typing a par updates the total and jumps to the next hole (without redrawing the form)
function parInput(el,i){
  const d=el.value.replace(/[^0-9]/g,'').slice(-1); el.value=d;
  const c=state.editCourse, was3=c.pars[i]===3; c.pars[i]=d?+d:null;
  document.getElementById('parTotal').textContent=coursePar(c)||'—';
  if(was3!==(c.pars[i]===3)) document.getElementById('p3carry').innerHTML=carryHTML(c);
  if(d && i<17) document.getElementById('par'+(i+1)).focus();
}
function saveCourse(){
  const c=state.editCourse;
  if(!c.name.trim()) return alert('Please type the course name.');
  if(c.pars.some(p=>!(p>=3&&p<=6))) return alert('Each hole par should be 3, 4, 5 or 6.');
  if(!(c.slope>=55&&c.slope<=155)) return alert('Slope should be between 55 and 155.');
  if(!(c.rating>50&&c.rating<90)) return alert('Please check the course rating (e.g. 71.2).');
  c.name=c.name.trim();
  if(c.id){ const i=db.courses.findIndex(x=>x.id===c.id); db.courses[i]=c; }
  else { c.id=uid('c'); db.courses.push(c); }
  if(!db.week.courseId) db.week.courseId=c.id;
  state.editCourse=null; save(); render();
}
function delCourse(id){
  if(db.history.some(h=>h.courseId===id)) return alert('This course has saved weeks in History, so it cannot be deleted.');
  if(!confirm('Delete this course?')) return;
  db.courses=db.courses.filter(c=>c.id!==id); if(db.week.courseId===id) db.week.courseId=(db.courses[0]||{}).id||null; save(); render();
}
function backup(){
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`MensLeague-backup-${todayStr()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function restore(inp){
  const f=inp.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.golfers||!d.settings) throw 0;
      if(!confirm(`Restore this backup? It has ${d.golfers.length} golfers and ${(d.history||[]).length} saved weeks.\n\nEverything currently in the program will be replaced.`)) return;
      const pw=db.settings.leaguePassword; db=d; normalize(); db.settings.leaguePassword=pw; save(); render(); alert('Backup restored.'); }
    catch(e){ alert('That file is not a Men\'s League backup.'); } };
  r.readAsText(f);
}

/* ======================= TEST GOLFERS ======================= */
const FIRST=['Mike','Dave','Steve','John','Bob','Tom','Jim','Bill','Rick','Paul','Mark','Gary','Larry','Dan','Ken','Ron','Joe','Frank','Pete','Greg'];
const LAST=['Anderson','Baker','Carter','Dupont','Evans','Fisher','Gagnon','Harris','Irving','Jensen','Kelly','Leblanc','Murphy','Nolan','Olsen','Parker','Quinn','Roy','Sullivan','Tremblay','Walsh','Young'];
function addTestGolfers(){
  let seed=42; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const used=new Set(db.golfers.map(g=>g.name.toLowerCase())); let added=0, i=0;
  while(added<100 && i<FIRST.length*LAST.length){
    const name=FIRST[i%FIRST.length]+' '+LAST[(i*7+Math.floor(i/FIRST.length))%LAST.length]; i++;
    if(used.has(name.toLowerCase())) continue; used.add(name.toLowerCase());
    const idx=Math.round((Math.pow(rnd(),0.9)*40 - 4)*10)/10;   // spread from about +4 to 36
    db.golfers.push({id:uid('g'),name,index:idx,active:true,test:true}); added++;
  }
  return added;
}
function addTestGolfersBtn(){ if(db.golfers.some(g=>g.test) && !confirm('Test golfers are already on the roster. Add another 100?')) return; const n=addTestGolfers(); save(); render(); alert(`Added ${n} test golfers.`); }
function removeTestGolfers(){
  const n=db.golfers.filter(g=>g.test).length; if(!n) return alert('There are no test golfers on the roster.');
  if(!confirm(`Remove all ${n} test golfers from the roster? Your real golfers stay.`)) return;
  db.golfers.forEach(g=>{ if(g.test){ delete db.week.players[g.id]; delete db.week.scores[g.id]; } });
  db.golfers=db.golfers.filter(g=>!g.test); db.week.flightsKey=''; save(); render();
}

/* ======================= SIGN IN, LEAGUES & START ======================= */
let league=null;   // the league being worked on: {id, slug, name}
const app=()=>document.getElementById('app');
const lsGet=k=>{ try{return localStorage.getItem(k);}catch(e){return null;} };
const lsSet=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){} };
const box=inner=>`<div class="card" style="max-width:580px;margin:40px auto">${inner}</div>`;
function signedOutLook(){
  document.getElementById('nav').style.display='none';
  document.querySelector('header h1').textContent='⛳ League Manager';
  document.getElementById('hdrInfo').textContent=''; setStatus('');
}
function showStart(){
  signedOutLook();
  app().innerHTML=box(`<h2 style="margin-top:0">⛳ League Manager</h2>
    <p class="muted">Check-in, flights, scores, payouts, and results on your golfers' phones.</p>
    <button class="btn big" style="width:100%" onclick="showLogin()">Sign In</button><br><br>
    <button class="btn big ghost" style="width:100%" onclick="showCreate()">+ Create a New League</button>`);
}
function showLogin(msg){
  signedOutLook();
  app().innerHTML=box(`<h2 style="margin-top:0">Sign in</h2>
    ${msg?`<div class="warn">${esc(msg)}</div>`:''}
    <label>Email</label><input id="em" type="email" autocomplete="username" style="width:100%"><br><br>
    <label>Password</label><input id="pw" type="password" autocomplete="current-password" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()"><br><br>
    <button class="btn big" style="width:100%" onclick="doLogin()">Sign In</button><br><br>
    <button class="btn ghost" onclick="showStart()">◀ Back</button>`);
  document.getElementById('em').focus();
}
function showCreate(msg){
  signedOutLook();
  app().innerHTML=box(`<h2 style="margin-top:0">Create a new league</h2>
    <p class="muted">The email and password you choose here are this league's admin login.</p>
    ${msg?`<div class="warn">${esc(msg)}</div>`:''}
    <label>League name</label><input id="ln" style="width:100%" placeholder="e.g. Men's League, Seniors"><br><br>
    <label>Admin email</label><input id="em" type="email" autocomplete="username" style="width:100%"><br><br>
    <label>Choose a password (at least 8 characters)</label><input id="pw" type="password" autocomplete="new-password" style="width:100%"><br><br>
    <label>Type the password again</label><input id="pw2" type="password" autocomplete="new-password" style="width:100%" onkeydown="if(event.key==='Enter')doCreate()"><br><br>
    <button class="btn big" style="width:100%" onclick="doCreate()">Create League</button><br><br>
    <button class="btn ghost" onclick="showStart()">◀ Back</button>`);
  document.getElementById('ln').focus();
}
async function doCreate(){
  const name=document.getElementById('ln').value.trim(), email=document.getElementById('em').value.trim(),
        password=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
  if(!name) return alert('Please type the league name.');
  if(!/^\S+@\S+\.\S+$/.test(email)) return alert('Please type a valid email address.');
  if(password.length<8) return alert('The password needs at least 8 characters.');
  if(password!==pw2) return alert('The two passwords are not the same. Please type them again.');
  lsSet('ml.pendingLeague',name);   // the league is created right after the first sign-in
  busy('Creating your league…');
  const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href.split(/[?#]/)[0]}});
  if(error){
    if(/already/i.test(error.message)){   // existing login: if the password matches, just add the league to it
      const r=await sb.auth.signInWithPassword({email,password});
      if(!r.error) return afterLogin();
      lsSet('ml.pendingLeague',null);
      return showCreate('That email already has a login. Sign in with it, then use Settings → Switch League / Create Another.');
    }
    lsSet('ml.pendingLeague',null);
    return showCreate('Could not create the login: '+error.message);
  }
  if(!data.session){
    app().innerHTML=box(`<h2 style="margin-top:0">📧 Check your email</h2>
      <p>We sent a message to <b>${esc(email)}</b>. Open it and click the link to confirm your email.</p>
      <p>Your league <b>${esc(name)}</b> will be ready as soon as you sign in.</p>
      <button class="btn big" style="width:100%" onclick="showLogin()">Go to Sign In</button>`);
    return;
  }
  afterLogin();
}
async function doLogin(){
  const email=document.getElementById('em').value.trim(), password=document.getElementById('pw').value;
  busy('Signing in…');
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error) return showLogin(/confirm/i.test(error.message)?'Please confirm your email first: open the message we sent you and click the link.':'That email or password is not right. Please try again.');
  afterLogin();
}
async function myLeagues(){
  const {data,error}=await sb.from('leagues').select('id,slug,name').order('created_at');
  if(error) throw error; return data;
}
async function afterLogin(showList){
  let ls;
  try{ ls=await myLeagues(); }
  catch(e){ console.error(e); app().innerHTML=box(`<p>Could not reach the league database. Please check the internet connection.</p><button class="btn big" onclick="location.reload()">Try Again</button>`); return; }
  const pending=lsGet('ml.pendingLeague');
  if(pending){ lsSet('ml.pendingLeague',null); return createLeague(pending); }
  if(!ls.length) return showNewLeague();
  const last=ls.find(l=>l.id===lsGet('ml.lastLeague'));
  if(!showList && ls.length===1) return openLeague(ls[0]);
  if(!showList && last) return openLeague(last);
  showPicker(ls);
}
function showPicker(ls){
  signedOutLook();
  app().innerHTML=box(`<h2 style="margin-top:0">Which league?</h2>
    ${ls.map(l=>`<button class="btn big ghost" style="width:100%;margin-bottom:10px;text-align:left" onclick='openLeague(${JSON.stringify(l).replace(/'/g,"&#39;")})'>⛳ ${esc(l.name)}</button>`).join('')}
    <br><button class="btn big" style="width:100%" onclick="showNewLeague()">+ Create Another League</button><br><br>
    <button class="btn ghost" onclick="signOut()">Sign Out</button>`);
}
function showNewLeague(){
  signedOutLook();
  app().innerHTML=box(`<h2 style="margin-top:0">Create a league</h2>
    <p class="muted">You'll be this league's admin, using the login you're signed in with.</p>
    <label>League name</label><input id="ln" style="width:100%" placeholder="e.g. Seniors" onkeydown="if(event.key==='Enter')createLeague(this.value)"><br><br>
    <button class="btn big" style="width:100%" onclick="createLeague(document.getElementById('ln').value)">Create League</button><br><br>
    <button class="btn ghost" onclick="afterLogin(true)">◀ Back</button>`);
  document.getElementById('ln').focus();
}
async function createLeague(name){
  name=String(name||'').trim(); if(!name) return alert('Please type the league name.');
  busy('Creating '+name+'…');
  const {data,error}=await sb.rpc('create_league',{league_name:name});
  if(error){ console.error(error); alert('Could not create the league. Please check the internet and try again.'); return showNewLeague(); }
  openLeague(data);
}
async function openLeague(l){
  if(dirty) await flush();
  league=l; lsSet('ml.lastLeague',l.id);
  state={tab:'checkin',search:'',scoreId:null,editCourse:null,viewWeek:null};
  document.querySelector('header h1').textContent='⛳ '+l.name;
  document.title=l.name+' – Admin';
  busy('Opening '+l.name+'…');
  let fresh;
  try{ fresh=await loadRemote(); }catch(e){ console.error(e); app().innerHTML=box(`<p>Could not load the league. Please check the internet connection.</p><button class="btn big" onclick="location.reload()">Try Again</button>`); return; }
  if(fresh){ addTestGolfers(); db.testSeeded=true; }
  if(!db.week.courseId && db.courses.length) db.week.courseId=db.courses[0].id;
  if(fresh){ await flush(); state.tab='settings'; } else { setStatus('✓ Saved','ok'); syncRoster(); }
  document.getElementById('nav').style.display='';
  render();
  if(fresh) alert(`Welcome to ${l.name}!\n\nStart here in Settings: add your course and set the league password.\n\n100 test golfers have been added so you can try things out. Remove them in Settings when you're ready.`);
}
async function switchLeague(){ if(dirty) await flush(); afterLogin(true); }
(async function boot(){
  const cfg=window.LEAGUE_CONFIG||{};
  if(!window.supabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey){
    app().innerHTML='<div class="card empty">This app is not connected to its online database yet (config.js), or there is no internet connection.</div>'; return;
  }
  sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  const {data:{session}}=await sb.auth.getSession();
  if(session) afterLogin(); else showStart();
})();
</script>
